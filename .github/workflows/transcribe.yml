name: Serverless AI Transcribe Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID matching GitHub Release tag'
        required: true
        type: string
      model_size:
        description: 'Faster-Whisper model size'
        required: false
        default: 'base'
        type: string
      language:
        description: 'Spoken language code (e.g. en or auto)'
        required: false
        default: 'auto'
        type: string
      beam_size:
        description: 'Beam size for decoding'
        required: false
        default: '1'
        type: string

jobs:
  transcribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Faster-Whisper
        run: |
          pip install --upgrade pip
          pip install faster-whisper

      - name: Download Audio from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading audio for job ${{ inputs.job_id }}..."
          gh release download "${{ inputs.job_id }}" --repo "${{ github.repository }}"

      - name: Run Speech Transcription
        run: |
          python worker_transcribe.py "${{ inputs.job_id }}" "${{ inputs.model_size }}" "${{ inputs.language }}" "${{ inputs.beam_size }}"

      - name: Upload Transcript to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading transcript.json to release ${{ inputs.job_id }}..."
          gh release upload "${{ inputs.job_id }}" transcript.json --repo "${{ github.repository }}" --clobber
